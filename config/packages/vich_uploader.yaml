vich_uploader:
  db_driver: orm

  mappings:
    personne_profile_pictures:
      uri_prefix: "%profile_pictures%"
      upload_destination: '%kernel.project_dir%/public/%profile_pictures%'
      namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
    personne_files:
      uri_prefix: "%documents%"
      upload_destination: "%kernel.project_dir%/public/%documents%"
      namer: Vich\UploaderBundle\Naming\SmartUniqueNamer
#        service: App\Naming\CustomFileNamer
#        options: { property: 'proprietaire.username'} # supposing that the object contains a "slug" attribute or a "getSlug" method
